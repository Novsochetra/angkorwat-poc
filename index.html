<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />

    <meta property="og:site_name" content="Angkor Heritage" />
    <meta property="og:title" content="មរតកអង្គរ · Angkor Heritage" />
    <meta property="og:description" content="Explore Angkor in a voxel world: glide, ride a hot air balloon and walk to Angkor Wat, Bayon, Ta Prohm, Preah Khan and Phnom Kulen." />
    <meta property="og:locale" content="km_KH" />

    <link rel="stylesheet" href="./src/ui/ui.css" />
    <link rel="stylesheet" href="./src/map/ui/map.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- (the interface's fonts, early for the loading screen: ui/ui.ts FONTS_HREF) -->
    <link id="mu-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;700;800&family=Pixelify+Sans:wght@500;600;700&family=Kantumruy+Pro:wght@400;600;700&family=Koulen&display=swap" />
    <style>
      /*
       * Loading screen while the map builds: a pixel Angkor Wat (ui/_loadTemple.ts)
       * rises row by row from its grey outline, the bar fills block by block and
       * the explorer (ui/_loadHero.ts) walks below it (main.ts sets --ld-cut,
       * --ld-segs and --ld-p), under a dusk sky with stars and fireflies. Then it
       * fades out.
       */
      body.map {
        background: #121726;
      }
      .map-loading {
        position: fixed;
        inset: 0;
        z-index: 50;
        display: grid;
        place-content: center;
        justify-items: center;
        overflow: hidden;
        background:
          radial-gradient(ellipse 60% 45% at 50% 62%, #5a3a33c0 0%, #3a2a3300 70%),
          linear-gradient(180deg, #0c1120 0%, #151b2e 45%, #2a2233 78%, #3a2a2c 100%);
        color: #f6ead6;
        font: 600 15px/1.4 'Nunito Sans', 'Kantumruy Pro', system-ui, sans-serif;
        /* (no fake bold: 'Koulen' has one weight) */
        font-synthesis: none;
        transition: opacity 0.9s ease;
      }
      .map-loading.done {
        opacity: 0;
        pointer-events: none;
      }
      /* Stars: pixel dots in the upper sky, twinkling in two sets. */
      .ld-stars,
      .ld-stars::after {
        position: absolute;
        inset: 0 0 45% 0;
        background:
          linear-gradient(#fff6, #fff6) 12% 18% / 2px 2px,
          linear-gradient(#fff5, #fff5) 23% 42% / 2px 2px,
          linear-gradient(#ffe9b8aa, #ffe9b8aa) 31% 12% / 3px 3px,
          linear-gradient(#fff4, #fff4) 44% 30% / 2px 2px,
          linear-gradient(#fff6, #fff6) 58% 9% / 2px 2px,
          linear-gradient(#fff4, #fff4) 67% 36% / 2px 2px,
          linear-gradient(#ffe9b899, #ffe9b899) 79% 16% / 3px 3px,
          linear-gradient(#fff5, #fff5) 88% 44% / 2px 2px,
          linear-gradient(#fff4, #fff4) 6% 60% / 2px 2px,
          linear-gradient(#fff4, #fff4) 94% 70% / 2px 2px;
        background-repeat: no-repeat;
        content: '';
      }
      .ld-stars::after {
        inset: 0;
        background:
          linear-gradient(#fff5, #fff5) 17% 30% / 2px 2px,
          linear-gradient(#ffe9b8aa, #ffe9b8aa) 38% 22% / 3px 3px,
          linear-gradient(#fff4, #fff4) 51% 48% / 2px 2px,
          linear-gradient(#fff6, #fff6) 73% 26% / 2px 2px,
          linear-gradient(#fff4, #fff4) 84% 8% / 2px 2px,
          linear-gradient(#fff5, #fff5) 97% 34% / 2px 2px;
        background-repeat: no-repeat;
        animation: ld-twinkle 3.2s ease-in-out infinite alternate;
      }
      .ld-stars {
        animation: ld-twinkle 4.1s ease-in-out -2s infinite alternate;
      }
      @keyframes ld-twinkle {
        from {
          opacity: 1;
        }
        to {
          opacity: 0.35;
        }
      }
      /* The temple: its grey outline, and the built part (the same art) above it. */
      .ld-temple {
        position: relative;
        /* (4 px a cell on a desktop: 93 cells; smaller in a short window, so the explorer below the bar still shows) */
        width: min(372px, 90vw, calc((100vh - 280px) * var(--ld-cols, 36) / var(--ld-rows, 27)));
        aspect-ratio: var(--ld-cols, 36) / var(--ld-rows, 27);
        margin-bottom: 26px;
        animation: ld-in 0.8s ease both;
      }
      .ld-temple::before {
        content: '';
        position: absolute;
        inset: -40% -55% -10%;
        z-index: -1;
        background: radial-gradient(closest-side, #ffb44a40, #ff8c2a14 55%, transparent);
      }
      .ld-temple > span,
      .ld-temple svg {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }
      .ld-ghost {
        filter: grayscale(1) brightness(0.55);
        opacity: 0.3;
      }
      .ld-built {
        clip-path: inset(var(--ld-cut, 100%) 0 0 0);
        filter: drop-shadow(0 0 14px #ffb44a55);
      }
      /*
       * The row being laid: the same art again, lit gold and cut to the built
       * part's top row, so the light sits on the stones and follows the
       * temple's outline (the glow is on the outer span: a filter runs before the clip).
       */
      .ld-front {
        filter: drop-shadow(0 0 2px #ffd36a) drop-shadow(0 0 8px #ffb44aaa);
        animation: ld-glint 0.9s ease-in-out infinite alternate;
      }
      .ld-lit {
        position: absolute;
        inset: 0;
        clip-path: inset(var(--ld-cut, 100%) 0 calc(100% - var(--ld-cut, 100%) - 100% / var(--ld-rows, 27)) 0);
        filter: sepia(1) saturate(2.6) brightness(1.55);
      }
      /* (the glint's animation would hold the opacity: it stops first) */
      .map-loading.is-built .ld-front {
        animation: none;
        opacity: 0;
        transition: opacity 0.4s;
      }
      @keyframes ld-glint {
        to {
          opacity: 0.4;
        }
      }
      @keyframes ld-in {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
      }
      .map-loading h1 {
        margin: 0 0 20px;
        font: 700 clamp(34px, 6vw, 54px) / 1.1 'Pixelify Sans', 'Koulen', 'Nunito Sans', system-ui, sans-serif;
        letter-spacing: 0.02em;
        color: #fbf1dd;
        text-shadow: 0 3px 0 #0009, 0 0 24px #ffb44a33;
      }
      /* The bar: a stepped frame, 20 gold blocks. */
      .ld-bar {
        position: relative;
        width: 288px;
        height: 20px;
        background: #e8c48a66;
        clip-path: polygon(0 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0, calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%, 4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px));
      }
      .ld-bar::before {
        content: '';
        position: absolute;
        inset: 2px;
        background: #0a0e18e6;
        clip-path: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0, calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px), calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%, 2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
      }
      .ld-bar span {
        position: absolute;
        left: 5px;
        top: 5px;
        bottom: 5px;
        width: calc(var(--ld-segs, 0) * 14px - 2px);
        background: linear-gradient(180deg, #ffe07c 0 3px, #f7b733 3px 7px, #d98e22 7px);
        -webkit-mask: repeating-linear-gradient(90deg, #000 0 12px, transparent 12px 14px);
        mask: repeating-linear-gradient(90deg, #000 0 12px, transparent 12px 14px);
      }
      /* (the words stay for screen readers; the explorer shows the progress) */
      .map-loading p {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      /*
       * The explorer walks below the bar, to its filled end (ui/_loadHero.ts):
       * a window one frame wide (24 × 29 cells of 3 px) over a strip of 9
       * frames — 0 standing, 1–6 walking, 7–8 facing us, waving.
       */
      .ld-walk {
        position: relative;
        width: 288px;
        height: 87px;
        margin-top: 6px;
      }
      /* (a faint path of stones under his boots) */
      .ld-walk::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        bottom: 3px;
        height: 3px;
        background: repeating-linear-gradient(90deg, #e8c48a2a 0 9px, transparent 9px 15px, #e8c48a2a 15px 21px, transparent 21px 27px);
        -webkit-mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
        mask: linear-gradient(90deg, transparent, #000 18%, #000 82%, transparent);
      }
      .ld-hero {
        position: absolute;
        bottom: 0;
        left: calc(var(--ld-p, 0) * (100% - 72px));
        width: 72px;
        height: 87px;
        overflow: hidden;
        transition: left 0.5s linear;
      }
      /* (shown once main.ts fills it, already at its place: no glide from 0) */
      .ld-hero:empty {
        display: none;
      }
      .ld-hero svg {
        display: block;
        width: 648px;
        height: 87px;
        animation: ld-hero-walk 0.72s steps(6) infinite;
      }
      @keyframes ld-hero-walk {
        from {
          transform: translateX(-72px);
        }
        to {
          transform: translateX(-504px);
        }
      }
      /* Built (just before the screen fades): he turns to us, hops (in the SVG a px is a cell) and waves. */
      .map-loading.is-built .ld-hero svg {
        transform: translateX(-504px);
        animation: ld-hero-wave 0.4s steps(1) infinite;
      }
      .map-loading.is-built .ld-hero-fig {
        animation: ld-hero-hop 0.36s steps(1) both;
      }
      @keyframes ld-hero-wave {
        50% {
          transform: translateX(-576px);
        }
      }
      @keyframes ld-hero-hop {
        20%,
        80% {
          transform: translateY(-1px);
        }
        40%,
        60% {
          transform: translateY(-2px);
        }
      }
      /* (less motion: he stands, and steps along instead of gliding) */
      @media (prefers-reduced-motion: reduce) {
        .ld-hero {
          transition: none;
        }
      }
      /* Fireflies over the jungle below. */
      .ld-fly {
        position: absolute;
        left: var(--x);
        bottom: var(--y);
        width: 3px;
        height: 3px;
        background: #ffe38a;
        box-shadow: 0 0 6px 2px #ffc85a88;
        opacity: 0;
        animation: ld-fly var(--t, 6s) ease-in-out var(--d, 0s) infinite;
      }
      @keyframes ld-fly {
        0%,
        100% {
          opacity: 0;
          transform: translate(0, 0);
        }
        30%,
        70% {
          opacity: 0.9;
        }
        50% {
          transform: translate(14px, -26px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .map-loading *,
        .map-loading *::after {
          animation: none !important;
        }
        .ld-fly {
          opacity: 0.6;
        }
      }
    </style>
  </head>
  <body class="map">
    <canvas id="scene"></canvas>
    <div id="ui" class="map-ui"></div>
    <div id="loading" class="map-loading" role="status">
      <div class="ld-stars" aria-hidden="true"></div>
      <div class="ld-temple" aria-hidden="true"><span class="ld-ghost"></span><span class="ld-built"></span><span class="ld-front"><span class="ld-lit"></span></span></div>
      <h1>មរតកអង្គរ</h1>
      <div class="ld-bar" aria-hidden="true"><span></span></div>
      <div class="ld-walk" aria-hidden="true"><div class="ld-hero"></div></div>
      <p>Clearing the path through the jungle…</p>
      <i class="ld-fly" style="--x: 14%; --y: 16%; --d: 0s" aria-hidden="true"></i>
      <i class="ld-fly" style="--x: 24%; --y: 28%; --d: -2.1s; --t: 7s" aria-hidden="true"></i>
      <i class="ld-fly" style="--x: 33%; --y: 9%; --d: -4s" aria-hidden="true"></i>
      <i class="ld-fly" style="--x: 64%; --y: 22%; --d: -1.2s; --t: 8s" aria-hidden="true"></i>
      <i class="ld-fly" style="--x: 76%; --y: 11%; --d: -3.3s" aria-hidden="true"></i>
      <i class="ld-fly" style="--x: 86%; --y: 30%; --d: -5s; --t: 7s" aria-hidden="true"></i>
      <i class="ld-fly" style="--x: 50%; --y: 6%; --d: -2.7s; --t: 9s" aria-hidden="true"></i>
    </div>
    <script type="module" src="./src/map/main.ts"></script>
  </body>
</html>
